<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">

<title>Prueba de estilo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root {
  --bg: #12160f; --bar: #1b2117; --fg: #efe8d4; --muted: #a9ad9a; --line: #313a2b;
  --accent: #f0c27a; --blue: #7ec8e3; --hud: rgba(24, 29, 20, .8);
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Inter", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font: 14px/1.45 var(--font-body); display: flex; flex-direction: column; }
.barra { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; background: var(--bar); border-bottom: 1px solid var(--line); padding: 10px 16px; }
.barra h1 { font: 800 1.15rem/1 var(--font-display); margin: 0; }
.barra h1 small { font: 500 .72rem var(--font-mono); color: var(--muted); margin-left: 8px; }
.grupo { display: flex; gap: 4px; align-items: center; }
.grupo > span { font: 500 .68rem var(--font-mono); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin-right: 4px; }
button { font: 600 .82rem var(--font-body); color: var(--fg); background: #262d21; border: 1px solid var(--line); border-radius: 7px; padding: 6px 11px; cursor: pointer; }
button:hover { background: #2f3828; }
button[aria-pressed="true"] { background: var(--accent); color: #1c2118; border-color: var(--accent); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
input[type=range] { accent-color: var(--accent); width: 130px; }
.stats { margin-left: auto; font: 500 .75rem var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.vista { position: relative; flex: 1; min-height: 320px; overflow: hidden; }
canvas { display: block; width: 100%; height: 100%; }
.ficha { position: absolute; left: 14px; bottom: 14px; max-width: 360px; background: var(--hud); border: 1px solid rgba(246,239,220,.16); border-radius: 10px; padding: 12px 14px; backdrop-filter: blur(4px); }
.ficha h2 { font: 800 1rem/1.1 var(--font-display); margin: 0 0 6px; color: var(--accent); }
.ficha p { margin: 0 0 6px; font-size: 12.5px; }
.ficha dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin: 0; font-size: 12px; }
.ficha dt { color: var(--muted); }
.ficha dd { margin: 0; }
.cargando { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(18,22,15,.7); font: 600 1rem var(--font-body); }
[hidden] { display: none !important; }
.ayuda { position: absolute; right: 14px; bottom: 14px; font: 500 11px var(--font-mono); color: #f6efdc; opacity: .75; background: var(--hud); padding: 6px 9px; border-radius: 7px; }
</style>
</head>
<body>
<header class="barra">
  <h1>Prueba de estilo <small>Raíces 3D · M0</small></h1>
  <div class="grupo" role="group" aria-label="Estilo">
    <span>Estilo</span>
    <button data-estilo="lowpoly">1 · Low-poly plano</button>
    <button data-estilo="pintado">2 · Pintado a mano</button>
    <button data-estilo="pbr">3 · PBR estilizado</button>
    <button data-estilo="final">4 · PBR + ComfyUI</button>
  </div>
  <div class="grupo" role="group" aria-label="Vista">
    <span>Vista</span>
    <button data-vista="general">General</button>
    <button data-vista="casa">Casa</button>
    <button data-vista="campo">Campo</button>
    <button data-vista="estanque">Estanque</button>
    <button data-vista="personaje">Personaje</button>
  </div>
  <label class="grupo"><span>Hora</span><input type="range" id="hora" min="0" max="100" value="40"></label>
  <button id="ao" aria-pressed="true" title="Oclusión ambiental (solo PBR)">Oclusión ambiental</button>
  <div class="stats" id="stats">—</div>
</header>
<main class="vista">
  <canvas id="lienzo"></canvas>
  <aside class="ficha" id="ficha"></aside>
  <div class="ayuda">Arrastra para girar · rueda para acercar · 1 2 3 4 cambia de estilo</div>
  <div class="cargando" id="cargando">Generando texturas…</div>
</main>

<script type="importmap">

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { Sky } from 'three/addons/objects/Sky.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';

import { clone as clonarConEsqueleto } from 'three/addons/utils/SkeletonUtils.js';

// Personaje: "Farmer" de Grab3D (CC0, https://grab3d.com/models/characters/farmer/), preparado para la web
// con borrador/blender/preparar_granjero_grab3d.py: 45 000 triángulos, animaciones "Reposo", "Andar" y
// "Correr". Mide 1,75 m como dice el GDD. Pasea por el sendero de la casa, descansa y vuelve.
const RUTA = { x: -6.0, z0: 2.8, z1: 24, velocidad: 1.25, descanso: 2.5 };
const modeloPersonaje = new GLTFLoader().loadAsync('modelos/granjero.glb').then((gltf) => {
  gltf.scene.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; o.frustumCulled = false; } });
  return gltf;
}).catch((e) => { console.warn('Sin modelo del personaje', e); return null; });
const personajes = [];
const paseo = { z: RUTA.z0, dir: 1, fase: 'andar', espera: 0, giro: 0 };
function actualizarPersonaje(dt) {
  const e = paseo;
  if (e.fase === 'andar') {
    e.z += e.dir * RUTA.velocidad * dt;
    if ((e.dir > 0 && e.z >= RUTA.z1) || (e.dir < 0 && e.z <= RUTA.z0)) { e.z = e.dir > 0 ? RUTA.z1 : RUTA.z0; e.fase = 'reposo'; e.espera = RUTA.descanso; }
  } else {
    e.espera -= dt;
    if (e.espera <= 0) { e.dir *= -1; e.fase = 'andar'; }
  }
  // De frente mira a +z: giro 0 avanza hacia +z, π hacia -z. Se da la vuelta al final del descanso.
  const sentido = e.fase === 'reposo' && e.espera < 0.9 ? -e.dir : e.dir;
  const meta = sentido > 0 ? 0 : Math.PI;
  let dif = meta - e.giro; dif = Math.atan2(Math.sin(dif), Math.cos(dif));
  e.giro += dif * Math.min(1, dt * 5);
  for (const p of personajes) {
    p.obj.position.set(RUTA.x, altura(RUTA.x, e.z), e.z); p.obj.rotation.y = e.giro;
    const quiere = e.fase === 'andar' ? p.andar : p.reposo;
    if (p.actual !== quiere) { quiere.reset().fadeIn(0.3).play(); p.actual?.fadeOut(0.3); p.actual = quiere; }
    if (p.obj.parent?.visible) p.mezclador.update(dt);
  }
}

// ───────────────────────── Utilidades: azar y ruido ─────────────────────────
function azar(semilla) {

}
const PERM = (() => { const r = azar(7); const p = [...Array(256).keys()]; for (let i = 255; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [p[i], p[j]] = [p[j], p[i]]; } const q = new Uint8Array(512); for (let i = 0; i < 512; i++) q[i] = p[i & 255]; return q; })();
const mod = (a, n) => ((a % n) + n) % n;
const hash2 = (x, y) => PERM[PERM[x & 255] + (y & 255)] / 255;
const suave = (e0, e1, x) => { const t = Math.min(1, Math.max(0, (x - e0) / (e1 - e0))); return t * t * (3 - 2 * t); };
const mezcla = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
const por = (c, k) => [c[0] * k, c[1] * k, c[2] * k];
const rgb = (hex) => { const n = parseInt(hex.slice(1), 16); return [(n >> 16 & 255) / 255, (n >> 8 & 255) / 255, (n & 255) / 255]; };

function valor(x, y, px = 256, py = 256) {
  const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
  const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
  const x0 = mod(ix, px), x1 = mod(ix + 1, px), y0 = mod(iy, py), y1 = mod(iy + 1, py);
  const a = hash2(x0, y0), b = hash2(x1, y0), c = hash2(x0, y1), d = hash2(x1, y1);

function fbm(x, y, px = 256, py = 256, oct = 5) {

// ───────────────────────── Recetas de texturas ─────────────────────────
// Cada receta devuelve, para (u, v) en [0,1): color sRGB, altura (relieve) y rugosidad.
const RECETAS = {
  tablones: (hex, n = 6, horizontal = true) => { const base = rgb(hex); return (u0, v0) => {
    const u = horizontal ? v0 : u0, v = horizontal ? u0 : v0;
    const i = Math.floor(u * n), lu = u * n - i, ri = hash2(i * 7 + 3, 19);
    const vv = mod(v + ri, 1);
    const grano = fbm(u * n * 6 + i * 3.1, vv * 3, 256, 3, 4);
    const veta = 0.5 + 0.5 * Math.sin(grano * 26 + lu * 4);
    const ranura = suave(0, 0.07, lu) * suave(1, 0.93, lu) * suave(0, 0.012, vv) * suave(1, 0.988, vv);
    let c = por(base, (0.78 + 0.22 * veta) * (0.82 + 0.34 * ri));
    c = por(c, 0.45 + 0.55 * ranura);
    return { c, h: ranura * (0.85 + 0.15 * grano), r: 0.68 + 0.25 * grano };
  }; },
  tejas: (hex, filas = 7, cols = 5) => { const base = rgb(hex); return (u, v) => {
    const fy = v * filas, j = Math.floor(fy), lv = fy - j;
    const fx = mod(u * cols + (j % 2) * 0.5, cols), i = Math.floor(fx), lu = fx - i;
    const r = hash2(i + j * 17, j * 31 + 5);
    const curva = Math.pow(Math.sin(lu * Math.PI), 0.5) * suave(0, 0.06, lu) * suave(1, 0.94, lu);
    const h = (0.35 + 0.65 * (1 - lv)) * curva * suave(0, 0.04, lv);
    const n = fbm(u * 12, v * 12, 12, 12, 4);
    let c = por(base, (0.78 + 0.36 * r) * (0.5 + 0.5 * h) * (0.85 + 0.3 * n));
    const musgo = suave(0.6, 0.74, fbm(u * 5 + 3, v * 5, 5, 5, 4));
    c = mezcla(c, [0.42, 0.46, 0.3], musgo * 0.55);
    return { c, h, r: 0.62 + 0.3 * (1 - h) };
  }; },
  piedra: (hex, celdas = 5) => { const base = rgb(hex); const mortero = [0.66, 0.62, 0.54]; return (u, v) => {
    const vo = voronoi(u, v, celdas), borde = vo.d2 - vo.d1;
    const m = suave(0.03, 0.12, borde), relieve = Math.sqrt(suave(0, 0.4, borde));
    const n = fbm(u * 16, v * 16, 16, 16, 4);

    return { c: mezcla(mortero, piedra, m), h: m * (0.55 + 0.45 * relieve) * (0.85 + 0.3 * n), r: 0.82 + 0.15 * (1 - m) };
  }; },
  tierra: (surcos = 0) => { const oscura = rgb('#5a3d26'), clara = rgb('#8f6a45'); return (u, v) => {
    const n = fbm(u * 8, v * 8, 8, 8, 5), n2 = fbm(u * 32, v * 32, 32, 32, 3);
    const g = voronoi(u, v, 24), piedrita = suave(0.13, 0.05, g.d1) * (g.id > 0.6 ? 1 : 0);

    c = mezcla(c, [0.62, 0.58, 0.52], piedrita);
    let h = 0.45 * n + 0.25 * n2 + 0.35 * piedrita;
    if (surcos) { const s = 0.5 + 0.5 * Math.cos(v * Math.PI * 2 * surcos); h = h * 0.4 + s * 0.6; c = por(c, 0.7 + 0.35 * s); }

  camino: () => { const base = rgb('#a08566'); return (u, v) => {
    const n = fbm(u * 6, v * 6, 6, 6, 5), g = voronoi(u, v, 14), canto = suave(0.25, 0.12, g.d1);
    let c = por(base, 0.8 + 0.35 * n);

  }; },
  cesped: () => { const a = rgb('#4f6b2c'), b = rgb('#86a04a'), seca = rgb('#a39a5a'); return (u, v) => {
    const n = fbm(u * 6, v * 6, 6, 6, 5), n2 = fbm(u * 48, v * 48, 48, 48, 3);

    return { c, h: n2 * 0.7 + n * 0.3, r: 0.92 };
  }; },
  corteza: (hex) => { const base = rgb(hex); return (u, v) => {
    const n = fbm(u * 6, v * 2, 6, 2, 5);
    const grieta = suave(0, 0.09, Math.abs(fbm(u * 10, v * 2, 10, 2, 4) - 0.5));
    return { c: por(base, (0.6 + 0.5 * n) * (0.45 + 0.55 * grieta)), h: grieta * (0.7 + 0.3 * n), r: 0.9 };
  }; },
  roca: () => { const base = rgb('#8d8a82'); return (u, v) => {
    const n = fbm(u * 5, v * 5, 5, 5, 6), n2 = fbm(u * 30, v * 30, 30, 30, 3);
    const grieta = suave(0, 0.05, Math.abs(fbm(u * 4 + 9, v * 4, 4, 4, 5) - 0.5));
    let c = por(base, (0.7 + 0.45 * n) * (0.88 + 0.2 * n2) * (0.6 + 0.4 * grieta));

  col: () => { const a = rgb('#3e6b34'), b = rgb('#9cc27a'); return (u, v) => {
    const n = fbm(u * 6, v * 6, 6, 6, 4), vena = suave(0.08, 0, Math.abs(Math.sin((u * 3 + n * 2) * Math.PI * 2)));
    return { c: mezcla(mezcla(a, b, n), [0.85, 0.92, 0.7], vena * 0.6), h: n * 0.5 + vena * 0.5, r: 0.55 };
  }; },
  follaje: () => { const a = rgb('#3f6a2c'), b = rgb('#93b850'); return (u, v) => {

// Catálogo: color plano (low-poly), receta y metros que cubre cada repetición de la textura.
const CAT = {
  cesped:     { color: '#8fae6a', receta: () => RECETAS.cesped(), escala: 5 },
  camino:     { color: '#c7a978', receta: () => RECETAS.camino(), escala: 3 },
  surcos:     { color: '#8a6239', receta: () => RECETAS.tierra(5), escala: 2.75 },
  piedra:     { color: '#a8a296', receta: () => RECETAS.piedra('#9d978c', 5), escala: 2.2 },
  madera:     { color: '#a2714a', receta: () => RECETAS.tablones('#94653f', 7, true), escala: 2.4 },
  maderaOsc:  { color: '#6e4b33', receta: () => RECETAS.tablones('#5e412c', 4, false), escala: 1.4 },
  tejas:      { color: '#b8593b', receta: () => RECETAS.tejas('#a9533a', 7, 5), escala: 2.8 },
  tejasGris:  { color: '#6f6a64', receta: () => RECETAS.tejas('#6b665f', 9, 7), escala: 2 },
  rojo:       { color: '#a33f2f', receta: () => RECETAS.tablones('#94382c', 8, false), escala: 3 },
  blanco:     { color: '#efe3c4', receta: () => RECETAS.tablones('#e2d8c0', 2, false), escala: 0.8 },
  postigo:    { color: '#8fa77a', receta: () => RECETAS.tablones('#7c986a', 4, false), escala: 1 },
  valla:      { color: '#8c7660', receta: () => RECETAS.tablones('#867260', 3, true), escala: 1.5 },
  corteza:    { color: '#6b4f3a', receta: () => RECETAS.corteza('#6a5442'), escala: 1.2 },
  roca:       { color: '#9b968c', receta: () => RECETAS.roca(), escala: 2.5 },
  col:        { color: '#6f9a4f', receta: () => RECETAS.col(), escala: 0.7 },
  follaje:    { color: '#6f9a4f', receta: () => RECETAS.follaje(), escala: 1.6 },

// Genera mapa de color, normales y rugosidad. En "pintado" hornea luz y posteriza (sin normal map).
function generarTexturas(receta, tam, pintado) {

  for (let y = 0; y < tam; y++) for (let x = 0; x < tam; x++) {
    const i = y * tam + x, s = receta((x + 0.5) / tam, 1 - (y + 0.5) / tam);
    col[i * 3] = s.c[0]; col[i * 3 + 1] = s.c[1]; col[i * 3 + 2] = s.c[2]; alt[i] = s.h; rug[i] = s.r;
  }
  const fuerza = pintado ? 7 : 4.5;
  const cvC = lienzo(tam), cvN = lienzo(tam), cvR = lienzo(tam);
  const dC = cvC.ctx.createImageData(tam, tam), dN = cvN.ctx.createImageData(tam, tam), dR = cvR.ctx.createImageData(tam, tam);
  const L = new THREE.Vector3(-0.45, 0.55, 0.7).normalize();

    const hy = alt[mod(y + 1, tam) * tam + x] - alt[mod(y - 1, tam) * tam + x];
    let nx = -hx * fuerza, ny = hy * fuerza, nz = 1; const ln = Math.hypot(nx, ny, nz); nx /= ln; ny /= ln; nz /= ln;
    let r = col[i * 3], g = col[i * 3 + 1], b = col[i * 3 + 2];
    if (pintado) {
      const luz = 0.78 + 0.42 * Math.max(0, nx * L.x + ny * L.y + nz * L.z) + 0.2 * (alt[i] - 0.5);
      const trazo = 1 + (fbm((x / tam) * 10, (y / tam) * 3, 10, 3, 3) - 0.5) * 0.18;
      r *= luz * trazo; g *= luz * trazo; b *= luz * trazo;
      const lum = 0.3 * r + 0.59 * g + 0.11 * b;
      r = lum + (r - lum) * 1.1; g = lum + (g - lum) * 1.1; b = lum + (b - lum) * 1.1;

        mat3 imH = mat3(instanceMatrix);
        vec3 wpH = instanceMatrix[3].xyz + imH * position;
        vec3 dirH = normalize(normalize(wpH - aCentro) + vec3(0.0, 0.35, 0.0));
        objectNormal = transpose(imH) * dirH;`)
      .replace('#include <begin_vertex>', `
        vec3 transformed = vec3(position);
        float faseH = uTiempo * 1.3 + aCentro.x * 0.3 + aCentro.z * 0.2 + instanceMatrix[3].y * 0.9;
        vec3 offH = vec3(sin(faseH), sin(faseH * 1.7) * 0.5, cos(faseH * 0.9)) * ${fuerza.toFixed(3)};

        vec3 transformed = vec3(position);

        vec3 ipV = instanceMatrix[3].xyz;
        float wV = aAltura * aAltura;
        float faseV = uTiempo * 1.7 + ipV.x * 0.23 + ipV.z * 0.17;

  const postes = [], barras = [], esquinas = [[x0, z0], [x1, z0], [x1, z1], [x0, z1], [x0, z0]];
  for (let e = 0; e < 4; e++) {
    const [ax, az] = esquinas[e], [bx, bz] = esquinas[e + 1], L = Math.hypot(bx - ax, bz - az), n = Math.max(1, Math.round(L / 2.1));
    for (let i = 0; i < n; i++) {
      const t0 = i / n, t1 = (i + 1) / n;
      const p0 = [ax + (bx - ax) * t0, az + (bz - az) * t0], p1 = [ax + (bx - ax) * t1, az + (bz - az) * t1];
      postes.push(matriz(p0[0], altura(p0[0], p0[1]) + 0.5, p0[1], 0.2 * (i % 3)));
      if (hueco && e === hueco.lado && i === hueco.i) continue;
      const mx = (p0[0] + p1[0]) / 2, mz = (p0[1] + p1[1]) / 2, ang = -Math.atan2(p1[1] - p0[1], p1[0] - p0[0]), y = altura(mx, mz);
      barras.push(matriz(mx, y + 0.45, mz, ang, L / n + 0.1, 1, 1), matriz(mx, y + 0.85, mz, ang, L / n + 0.1, 1, 1));
    }
  }
  const poste = new THREE.BoxGeometry(0.14, 1.1, 0.14), barra = new THREE.BoxGeometry(1, 0.09, 0.05);
  g.add(instanciado(poste, 'valla', postes), instanciado(barra, 'valla', barras));
}

// Parche de suelo (camino, tierra) que sigue el terreno, con bordes difuminados.
function parche(x0, z0, x1, z1, nombre, opciones = {}) {
  const w = x1 - x0, d = z1 - z0, paso = opciones.paso ?? 0.4;
  const geo = new THREE.PlaneGeometry(w, d, Math.ceil(w / paso), Math.ceil(d / paso)); geo.rotateX(-Math.PI / 2);
  const p = geo.attributes.position, colr = new Float32Array(p.count * 4), cx = (x0 + x1) / 2, cz = (z0 + z1) / 2, borde = opciones.borde ?? 0.7;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i) + cx, z = p.getZ(i) + cz;
    let y = altura(x, z) + 0.04;
    if (opciones.surcos && estilo !== 'lowpoly') y += 0.09 * (0.5 + 0.5 * Math.cos(z * Math.PI * 2 / 0.55)) * suave(0, 0.6, Math.min(x - x0, x1 - x, z - z0, z1 - z));
    p.setY(i, y);
    const dist = Math.min(x - x0, x1 - x, z - z0, z1 - z);
    const irregular = borde * (0.6 + 0.8 * fbm(x * 0.7, z * 0.7, 256, 256, 3));
    const a = estilo === 'lowpoly' ? 1 : suave(0, irregular, dist);
    colr.set([1, 1, 1, a], i * 4);
  }
  geo.setAttribute('color', new THREE.BufferAttribute(colr, 4));
  geo.computeVertexNormals();
  if (estilo !== 'lowpoly') uvProyeccion(geo, escalaDe(nombre));
  const m = new THREE.Mesh(geo, material(nombre, { superpuesto: true }));
  m.position.set(cx, 0, cz); m.receiveShadow = true; m.renderOrder = 1;
  return m;
}

function terreno(g) {
  const low = estilo === 'lowpoly', tam = 240, seg = low ? 60 : 240;
  const geo = new THREE.PlaneGeometry(tam, tam, seg, seg); geo.rotateX(-Math.PI / 2); geo.translate(0, 0, 3);
  const p = geo.attributes.position;
  for (let i = 0; i < p.count; i++) p.setY(i, altura(p.getX(i), p.getZ(i)));
  geo.computeVertexNormals();
  const suelo = pieza(geo, 'cesped'); suelo.castShadow = false; g.add(suelo);
  g.add(parche(-7.6, 3, -4.4, 30, 'camino'), parche(-6, 4.8, 11.8, 7.6, 'camino'), parche(8.6, -4, 11.4, 6, 'camino'));
  g.add(parche(1.4, 9.4, 18.6, 20.6, 'surcos', { surcos: true, borde: 0.4, paso: 0.2 }), parche(-17.6, 6.6, -10.4, 13.4, 'surcos', { surcos: true, borde: 0.4, paso: 0.2 }));
  // agua
  const aguaGeo = new THREE.CircleGeometry(ESTANQUE.r + 0.3, 64); aguaGeo.rotateX(-Math.PI / 2);
  let aguaMat;
  if (low) aguaMat = new THREE.MeshStandardMaterial({ color: '#5b9cc0', roughness: 0.6, flatShading: true });
  else if (estilo === 'pintado') aguaMat = new THREE.MeshStandardMaterial({ color: '#5aa2c8', roughness: 0.35, map: generarTexturas(RECETAS.agua(), 256, true).mapa });
  else { const t = generarTexturas(RECETAS.agua(), 512, false); t.normal.repeat.set(4, 4); aguaMat = new THREE.MeshPhysicalMaterial({ color: '#244b55', roughness: 0.04, metalness: 0, normalMap: t.normal, normalScale: new THREE.Vector2(0.35, 0.35), transparent: true, opacity: 0.9, envMapIntensity: 1.3 }); aguaMat.userData.animar = t.normal; }
  const agua = new THREE.Mesh(aguaGeo, aguaMat); agua.position.set(ESTANQUE.x, -0.45, ESTANQUE.z); agua.receiveShadow = true; g.add(agua);
  aguaAnimada = aguaMat.userData.animar ?? null;
}
let aguaAnimada = null;

function cielo(g) {
  if (esPBR()) { const s = new Sky(); s.scale.setScalar(5000); g.add(s); g.userData.sky = s; return; }
  const arriba = new THREE.Color(estilo === 'pintado' ? '#78acd8' : '#9cc8e0'), horizonte = new THREE.Color(estilo === 'pintado' ? '#f4dfb4' : '#d4e6ea');
  const mat = new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: { arriba: { value: arriba }, horizonte: { value: horizonte } },
    vertexShader: 'varying vec3 vDir; void main(){ vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
    fragmentShader: 'uniform vec3 arriba; uniform vec3 horizonte; varying vec3 vDir; void main(){ float t = smoothstep(0.0, 0.4, vDir.y); gl_FragColor = vec4(mix(horizonte, arriba, t),1.0); #include <tonemapping_fragment>\n #include <colorspace_fragment>\n }'.replace(' #include', '\n#include'),
  });
  const esfera = new THREE.Mesh(new THREE.SphereGeometry(4000, 32, 16), mat); g.add(esfera);
}

// ───────────────────────── Escenas por estilo ─────────────────────────
const CONF = {
  lowpoly: { tono: THREE.NoToneMapping, exp: 1, sombra: 2048, sol: 2.4, hemi: 1.2, niebla: () => new THREE.Fog('#d4e6ea', 80, 220), radio: 1 },
  pintado: { tono: THREE.ACESFilmicToneMapping, exp: 1.4, sombra: 2048, sol: 2.6, hemi: 1.5, niebla: () => new THREE.FogExp2('#ecdcb8', 0.003), radio: 3 },
  pbr:     { tono: THREE.ACESFilmicToneMapping, exp: 0.85, sombra: 4096, sol: 3.4, hemi: 0.25, niebla: () => new THREE.FogExp2('#c6d3d8', 0.0022), radio: 2 },
  final:   { tono: THREE.ACESFilmicToneMapping, exp: 0.9, sombra: 4096, sol: 3.4, hemi: 0.25, niebla: () => new THREE.FogExp2('#cfd6d2', 0.0022), radio: 2 },
};
const FICHAS = {
  lowpoly: { t: 'Low-poly plano', p: 'Lo que dice hoy el GDD: colores planos de la paleta, sombreado plano, sin texturas ni hierba.', coste: 'Muy bajo', arte: 'Formas por script en Blender, muy rápido' },
  pintado: { t: 'Pintado a mano', p: 'Texturas con la luz y el desgaste pintados (aquí generadas por código), sombreado suave, copas en volumen y hierba estilizada.', coste: 'Medio', arte: 'Hay que pintar texturas a mano: lento y pide oficio' },
  pbr: { t: 'PBR estilizado', p: 'Materiales físicos (color, relieve, rugosidad), cielo físico como luz de entorno, tonos ACES, oclusión ambiental (GTAO), hojas en tarjetas con viento y hierba densa.', coste: 'Medio-alto', arte: 'Texturas CC0 de Poly Haven (1k, aquí cargadas desde su CDN) + Blender. Coles, calabazas, hojas y trigo siguen siendo de código' },
  final: { t: 'PBR + ComfyUI (propuesta)', p: 'El estilo 3 con texturas propias: madera, tejas, hierba, tierra, caminos y pinturas generadas con ComfyUI (Qwen-Image 2512) con una receta común. Piedra, roca y corteza siguen en Poly Haven con un tinte cálido. Piezas con bordes biselados.', coste: 'Medio-alto (como el 3)', arte: 'Receta en borrador/workflows/texturas/recetas.json; normales y rugosidad deducidas del color' },
};
const escenas = {};

function construir(nombre) {
  estilo = nombre;
  const g = new THREE.Group(); g.name = nombre;
  const marcaAO = ocultosAO.length;
  terreno(g); cielo(g);
  const casa = construirCasa(); casa.position.set(-6, altura(-6, -4), -4); g.add(casa);
  const granero = construirGranero(); granero.position.set(10, altura(10, -8), -8); g.add(granero);
  const lena = construirLena(); lena.position.set(-13.5, altura(-13, -2), -2.5); lena.rotation.y = Math.PI / 2; g.add(lena);
  vallas(g, 1.4, 9.4, 18.6, 20.6, { lado: 0, i: 2 }); vallas(g, -17.6, 6.6, -10.4, 13.4, { lado: 1, i: 1 });
  arboles(g); rocas(g); cultivos(g);
  modeloPersonaje.then((gltf) => {
    if (!gltf) return;
    const obj = clonarConEsqueleto(gltf.scene); g.add(obj);
    const mezclador = new THREE.AnimationMixer(obj);
    const accion = (n) => mezclador.clipAction(THREE.AnimationClip.findByName(gltf.animations, n));
    personajes.push({ obj, mezclador, andar: accion('Andar'), reposo: accion('Reposo'), actual: null });
  });
  if (nombre !== 'lowpoly') cesped(g);
  g.userData.ao = ocultosAO.splice(marcaAO);
  g.userData.agua = aguaAnimada;
  return g;
}

function prepararPost() {
  if (composer) return;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  const rt = new THREE.WebGLRenderTarget(w * renderer.getPixelRatio(), h * renderer.getPixelRatio(), { type: THREE.HalfFloatType, samples: 4 });
  composer = new EffectComposer(renderer, rt);
  composer.addPass(new RenderPass(scene, camera));
  gtao = new GTAOPass(scene, camera, w, h);
  gtao.updateGtaoMaterial({ radius: 0.6, distanceExponent: 1.5, thickness: 1.5, scale: 1.2, samples: 16 });
  gtao.blendIntensity = 1;
  const renderGtao = gtao.render.bind(gtao);
  // Las tarjetas con transparencia (hojas, hierba, trigo) darían cuadrados en la oclusión: se ocultan en esa pasada.
  gtao.render = (...a) => { const ocultos = escenas[estilo]?.userData.ao ?? []; ocultos.forEach(m => m.visible = false); renderGtao(...a); ocultos.forEach(m => m.visible = true); };
  composer.addPass(gtao);
  composer.addPass(new OutputPass());
  composer.setSize(w, h);
}

function aplicarEstilo(nombre) {
  estilo = nombre;
  const c = CONF[nombre];
  for (const [n, g] of Object.entries(escenas)) g.visible = n === nombre;
  renderer.toneMapping = c.tono; renderer.toneMappingExposure = c.exp;
  if (sol.shadow.mapSize.x !== c.sombra) { sol.shadow.mapSize.set(c.sombra, c.sombra); sol.shadow.map?.dispose(); sol.shadow.map = null; }
  sol.shadow.radius = c.radio;
  hemi.intensity = c.hemi;
  scene.fog = c.niebla();
  if (esPBR()) prepararPost();
  actualizarSol();
  document.querySelectorAll('[data-estilo]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.estilo === nombre)));
  document.getElementById('ao').hidden = !esPBR();
  const f = FICHAS[nombre];
  document.getElementById('ficha').innerHTML = `<h2>${f.t}</h2><p>${f.p}</p><dl><dt>Coste</dt><dd>${f.coste}</dd><dt>Arte</dt><dd>${f.arte}</dd></dl>`;
  try { localStorage.setItem('prueba-estilo', nombre); } catch { /* sin almacenamiento */ }
}

async function cambiarEstilo(nombre) {
  if (!escenas[nombre]) {
    const aviso = document.getElementById('cargando'); aviso.hidden = false;
    aviso.textContent = 'Generando texturas…';
    await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
    estilo = nombre;
    if (esPBR()) await cargarPH(aviso);
    if (nombre === 'final') { try { await cargarComfy(aviso); } catch (e) { console.warn('Sin texturas de ComfyUI', e); cacheComfy.clear(); } }
    escenas[nombre] = construir(nombre); scene.add(escenas[nombre]);
    aviso.hidden = true;
  }
  aplicarEstilo(nombre);
}

function actualizarSol() {
  const h = +document.getElementById('hora').value / 100;
  const elev = THREE.MathUtils.degToRad(5 + 55 * h), azim = THREE.MathUtils.degToRad(215);
  dirSol.set(Math.cos(elev) * Math.sin(azim), Math.sin(elev), Math.cos(elev) * Math.cos(azim));
  sol.position.copy(sol.target.position).addScaledVector(dirSol, 90);
  const calido = new THREE.Color('#ffa860'), blanco = new THREE.Color('#fff3df');
  sol.color.copy(calido).lerp(blanco, suave(0.05, 0.55, h));
  sol.intensity = CONF[estilo].sol * (0.55 + 0.45 * suave(0, 0.4, h));
  if (esPBR()) {
    const sky = escenas[estilo]?.userData.sky;
    for (const s of [sky, cieloEnv].filter(Boolean)) {
      const u = s.material.uniforms;
      u.sunPosition.value.copy(dirSol); u.turbidity.value = 2.5; u.rayleigh.value = 2.2; u.mieCoefficient.value = 0.003; u.mieDirectionalG.value = 0.85;
    }
    entornoRT?.dispose();
    entornoRT = pmrem.fromScene(escenaEnv, 0, 0.1, 200);
    scene.environment = entornoRT.texture; scene.environmentIntensity = 0.85;
  } else scene.environment = null;
}

// ───────────────────────── Vistas, interfaz y bucle ─────────────────────────
const VISTAS = {
  general: [[38, 30, 46], [2, 0, 2]],
  casa: [[-1.5, 2.0, 9.5], [-6.5, 2.4, -2]],
  campo: [[20, 2.2, 23], [9, 0.8, 14]],
  estanque: [[-12, 2.5, -4], [-20, -0.3, -13]],
};
let seguir = false;
const objetivoPersonaje = () => new THREE.Vector3(RUTA.x, altura(RUTA.x, paseo.z) + 1.05, paseo.z);
function irAVista(n) {
  seguir = n === 'personaje';
  if (seguir) { const t = objetivoPersonaje(); controls.target.copy(t); camera.position.copy(t).add(new THREE.Vector3(2.6, 0.6, 3.4)); controls.update(); }
  else { const [p, t] = VISTAS[n]; camera.position.set(...p); controls.target.set(...t); controls.update(); }
  document.querySelectorAll('[data-vista]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.vista === n)));
}
document.querySelectorAll('[data-estilo]').forEach(b => b.addEventListener('click', () => cambiarEstilo(b.dataset.estilo)));
document.querySelectorAll('[data-vista]').forEach(b => b.addEventListener('click', () => irAVista(b.dataset.vista)));
document.getElementById('hora').addEventListener('input', actualizarSol);
document.getElementById('ao').addEventListener('click', (e) => { if (!gtao) return; gtao.enabled = !gtao.enabled; e.currentTarget.setAttribute('aria-pressed', String(gtao.enabled)); });
addEventListener('keydown', (e) => { const n = { 1: 'lowpoly', 2: 'pintado', 3: 'pbr', 4: 'final' }[e.key]; if (n) cambiarEstilo(n); });

function ajustar() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
  composer?.setSize(w, h); gtao?.setSize(w, h);
}
new ResizeObserver(ajustar).observe(canvas);

const reloj = new THREE.Clock(), statsEl = document.getElementById('stats');
let cuadros = 0, ultimo = 0, previo = 0;
function bucle() {
  requestAnimationFrame(bucle);
  const t = reloj.getElapsedTime();
  uTiempo.value = t;
  const dt = Math.min(0.1, t - previo); previo = t;
  actualizarPersonaje(dt);
  if (seguir) { const d = objetivoPersonaje().sub(controls.target); controls.target.add(d); camera.position.add(d); }
  const agua = escenas[estilo]?.userData.agua; if (agua) agua.offset.set(t * 0.012, t * 0.008);
  controls.update();
  renderer.info.reset();
  if (esPBR() && composer) composer.render(); else renderer.render(scene, camera);
  cuadros++;
  if (t - ultimo > 0.5) {
    const fps = Math.round(cuadros / (t - ultimo)); cuadros = 0; ultimo = t;
    statsEl.textContent = `${fps} fps · ${renderer.info.render.calls} draw calls · ${Math.round(renderer.info.render.triangles / 1000)}k triángulos`;
  }
}

let inicial = 'pbr';
try { inicial = localStorage.getItem('prueba-estilo') || 'pbr'; } catch { /* sin almacenamiento */ }
ajustar(); irAVista('general');
await cambiarEstilo(inicial);
bucle();
</script>
